hccl_vm:
    console_level: 2
    file_level: 1
    max_file_size: 52428800
    max_files: 65535
    file_path: logs
    file_base_name: app_log
    file_suffix: .log
    enable_compress: false

proxy:
    console_level: 2
    file_level: 1
    max_file_size: 52428800
    max_files: 65535
    file_path: logs/proxy
    file_base_name: app_log
    file_suffix: .log
    enable_compress: false

runner:
    console_level: 6
    file_level: 2
    max_file_size: 52428800
    max_files: 65535
    file_path: logs/runner
    file_base_name: app_log
    file_suffix: .log
    enable_compress: false

checker:
    console_level: 2
    file_level: 0
    max_file_size: 52428800
    max_files: 65535
    file_path: logs/checker
    file_base_name: app_log
    file_suffix: .log
    enable_compress: false

# 拓扑生成脚本(generate_cluster_topo.sh/generate_server_topo.sh/allocate_eid.sh)日志配置
# console_level: 脚本控制台日志级别, 与C++日志级别定义一致:
#   0-trace 1-debug 2-info 3-warn 4-error 5-critical 6-off
#   debug(1): 输出全部日志(含逐server/逐die/逐端口明细)
#   info(2):  输出步骤与汇总信息(默认)
#   warn(3):  仅输出警告与错误
#   error(4): 仅输出错误
#   off(6):   不输出任何日志
script:
    console_level: 2

