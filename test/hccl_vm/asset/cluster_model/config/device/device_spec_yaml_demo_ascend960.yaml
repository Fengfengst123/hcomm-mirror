  #   两遍，并额外需要一条防漂移校验（原加载器校验 6，现已取消），违背 D10 单一权威。
  #
  #   ★ 交叉验证（S1 UT 断言）: GetCaps() 的推导结果必须与 hccp_ccu_stub.cc:98-125
  #     SetCcuV2ResourceBasicInfo 的现值逐项相等（10/10），否则说明 regions/ms 填错。
