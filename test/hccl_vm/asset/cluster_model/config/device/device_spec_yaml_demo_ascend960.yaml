# =====================================================================================
# 派生量（由 device_spec 库计算，yaml 中不冗余存储）
# =====================================================================================
#   backingSize（设计决策 D4 方案 C：单 die 稀疏 backing 的 shm 大小）
#     = ccu.resource_space_size = 0x4800000（72 MiB）
#       ★ 取 hcomm 权威值 CCU_V1_V2_RESOURCE_SIZE（ccu_res_specs.h:24、.cc:765），
#         **不用** max(regions ∪ ms 末端) 推导。A6 上两者恰好相等（巧合）：
#           max(0x180000+0x8000, 0x4600000+0x200000) = 0x4800000 = 72 MiB
#         但 A5 上 max 只有 0x940000（9.25 MiB），相差 62.75 MiB → 定义必须取权威值。
#     加载器校验 8: max(regions ∪ ms 末端) ≤ resource_space_size ≤ die_size
#                   0x4800000 ≤ 0x4800000 ≤ 0x40000000 ✓（A6 取等）
#     构成: regions 1.53 MiB + 未建模空间 62.47 MiB（0x188000..0x4000000）+ MS 8 MiB
#     实存: tmpfs 稀疏、按触碰页计费；PFE/JETTY/MISSION/LOOP/CHANNEL 与未建模空间
#           无人写 → 0 页。故 72 MiB 只是 ftruncate 名义长度与 VA 预留。
#     ⚠ CCU shm 必须走 MemoryManager::AllocMemByName，**禁止**经
#       DeviceMemoryManager::AllocPhyMem/AcquirePhyMem —— 后者带 CommPoolPolicy，
#       size ≥ kBigBlockThreshold(200MB) 且 check-only 模式下会引流到全 rank 共享的
#       HcclCommPool，导致跨 rank CCU 状态互相覆盖（设计文档 §4.5.1 硬约束 1 / R1b）。
#       A5/A6 的 72 MiB 距该阈值余量充足，但约束必须写死。
#
#   典型 ccuDieBase = rankBase + 0xE00000000 + die_offsets[d]:
#     rank0 die0 = 0x8e00000000      rank0 die1 = 0x8e40000000
#     rank1 die0 = 0x18e00000000     rank1 die1 = 0x18e40000000
#
#   VA 位宽（风险 R4）: rank ≥ 128 时窗口起点超出 47-bit 规范用户 VA
#   （rank127 起点 0x7F8000000000 < 2^47；rank128 起点 0x808000000000 > 2^47），
#   加载器校验 7 输出位宽告警；模拟设备 VA 非 host 可解引用。
#   注：user_mem 扩至 1022 GiB 不改变该临界 —— 即使按旧的 56 GiB 上界，
#   rank127 顶端 0x7F8000000000+56GiB = 0x806000000000 也已超 2^47。
# =====================================================================================

# =====================================================================================
# 加载器校验汇总（设计文档 §4.3.1，fail-fast：配置错不允许启动）
# =====================================================================================
#   1. 区间互不重叠，且 [offset, offset+size) ⊂ [0, die_size)。
#      ★ 作用域必须是 regions[] ∪ ms.ccua_windows[] **合并**检查 —— MS 不在 regions 里，
#        分开查会漏掉"某 region 与 MS 窗口重叠"（A6 上 MS 起于 0x4000000，
#        regions 止于 0x188000，当前不重叠，但 schema 允许写成重叠）。
#   2. entry_size × count ≤ size（entry_size == 0 的不透明块跳过此检查）
#   3. MS **per-window** 覆盖（★ 不用求和式 ms_num ≤ Σ窗口槽数 —— 异构窗口下求和式
#      会漏判：如窗口容量 [256,512,512,512] 时 Σ=1792 ≥ 1536 通过，
#      但 localIdx_max=383 > 255 使窗口0 溢出）:
#        localIdx_max = ((ms_num-1)/(ccua_num×interleave))×interleave + (interleave-1)
#        ∀i: localIdx_max × ms_size < ccua_windows[i].size
#      另需: ccua_num == len(ccua_windows)、ccua_windows[i].index == i（有序无重复）、
#            窗口互不重叠
#   4. len(ccu.die_offsets) == soc.die_num；die 窗口互不重叠
#      （die_offsets[i] + die_size ≤ die_offsets[i+1]，排序后逐对检查）
#   5. partitions 铺满性与 user_mem 派生:
#      - 按 offset 升序、互不重叠、**完整铺满** [0, rank_window_size)
#        （首段 offset == 0；末段 offset+size == rank_window_size；相邻段首尾相接）
#      - 恰好一个 name=="ccu" 段；name 只允许 user_mem / ccu（本期白名单）
#      - ccu 段容量: partitions[ccu].offset + max(die_offsets) + die_size
#                     ≤ partitions[ccu].offset + partitions[ccu].size
#      - userMemTotal = Σ partitions[name=="user_mem"].size > 0，段数 ≥ 1
#      - rank_window_size ≤ rank_stride
#      ★ 不再有 alloc_guard.user_mem_limit：可用额度由 user_mem 段求和派生（1022 GiB），
#        rtMalloc 不踩 CCU 由 per-segment first-fit **结构性保证**，不靠限额常量。
#   6. （已取消）原为 "caps.* 与 regions[*].count 一致"；caps 段已从 yaml 移除，
#      改由 DeviceSpec::GetCaps() 推导，无第二份数据需要校验（编号保留以免交叉引用失效）
#   7. rank_base + GetMaxRanks() × rank_stride 位宽检查 → 超 47-bit 打 **WARN**（R4）。
#      注: max_ranks 来自 GetMaxRanks()（sim_capacity_limits.h:30-45，可被
#      HCCL_VM_MAX_RANKS 覆盖），故本校验结果依赖运行时环境，须在 start 阶段
#      （拓扑已知后）执行，不能在 LoadAll() 内做。
#   8. max(regions ∪ ms 末端) ≤ ccu.resource_space_size ≤ ccu.die_size
#   9. 扫描 config/cluster/*.yaml + config/server_or_pod/*.yaml 出现的全部 soc_version，
#      每个必须**唯一命中**一份 device spec（大小写不敏感最长前缀）；
#      反向：每份 spec 的 name 至少被一个 soc_version 命中（防 spec 腐化）。
#      注：本文件 soc.soc_version 字段**不参与**此校验（决策 (i)，加载器完全忽略）。
# =====================================================================================

